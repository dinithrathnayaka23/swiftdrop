# Development override with hot reload, run from source inside containers:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
#   frontend  Vite dev server with HMR on http://localhost:5173 (edits in ./frontend apply instantly)
#   backend   ./mvnw spring-boot:run on ./backend (restart the container to pick up Java changes:
#             docker compose -f docker-compose.yml -f docker-compose.dev.yml restart backend)
#
# Prefer running backend/frontend directly on your machine? You don't need this file:
#   docker compose up -d postgres rabbitmq

services:
  backend:
    build: !reset null
    image: maven:3.9-eclipse-temurin-21
    working_dir: /workspace
    command: ["mvn", "-B", "-ntp", "spring-boot:run"]
    volumes:
      - ./backend:/workspace
      - maven_repo:/root/.m2
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health/readiness > /dev/null || exit 1"]
      start_period: 180s

  frontend:
    build: !reset null
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_PROXY_TARGET: http://backend:8080
      VITE_ENABLE_DEV_LOGIN: "true"
      CHOKIDAR_USEPOLLING: "true"   # file watching through Docker Desktop bind mounts on Windows/macOS
    ports: !override
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  maven_repo:
  frontend_node_modules:
