{{- $ctx := dict "root" $ "component" "backend" }}
apiVersion: v1
kind: Service
metadata:
  # The frontend's nginx.conf proxies /api to http://backend:8080: keep this name.
  name: backend
  labels:
    {{- include "swiftdrop.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "swiftdrop.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Proof-of-delivery photos. helm uninstall keeps this claim, so photos survive a reinstall.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-proofs
  labels:
    {{- include "swiftdrop.labels" $ctx | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backend.proofStorage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    {{- include "swiftdrop.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  # Recreate, not rolling: two pods at once would both run the unlocked WebhookRetryJob.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "swiftdrop.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "swiftdrop.labels" $ctx | nindent 8 }}
      annotations:
        # Restart the pod when its configuration changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.backend.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # Service links would inject REDIS_PORT=tcp://... and similar, clashing with our settings.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        # gid of the "swiftdrop" user in the backend image, so it can write the proofs volume.
        fsGroup: 101
      volumes:
        - name: proofs
          persistentVolumeClaim:
            claimName: backend-proofs
      initContainers:
        # Flyway and the RabbitMQ/Redis clients need their servers up before Spring starts.
        - name: wait-for-dependencies
          image: {{ .Values.initImage }}
          command:
            - sh
            - -c
            - |
              for target in postgres:5432 rabbitmq:5672 redis:6379; do
                until nc -z -w 2 "${target%:*}" "${target#*:}"; do
                  echo "waiting for $target"; sleep 2
                done
              done
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
      containers:
        - name: backend
          image: {{ include "swiftdrop.image" (dict "root" $ "image" .Values.backend.image) }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: swiftdrop-config
            - secretRef:
                name: {{ include "swiftdrop.secretName" . }}
          ports:
            - name: http
              containerPort: 8080
          # JVM start plus Flyway migrations: allow up to 5 minutes before liveness applies.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: proofs
              mountPath: /data/proofs
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
