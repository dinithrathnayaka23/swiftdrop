{{- if not .Values.secrets.existingSecret }}
{{- $values := .Values.secrets.values }}
apiVersion: v1
kind: Secret
metadata:
  name: swiftdrop-secrets
  labels:
    {{- include "swiftdrop.labels" (dict "root" $ "component" "backend") | nindent 4 }}
type: Opaque
stringData:
  {{- range $key := list "POSTGRES_USER" "POSTGRES_PASSWORD" "RABBITMQ_USER" "RABBITMQ_PASSWORD" "REDIS_PASSWORD" "JWT_SECRET" "API_KEY_PEPPER" "WEBHOOK_SECRET_KEY" "ADMIN_EMAIL" "ADMIN_PASSWORD" }}
  {{- $value := required (printf "secrets.values.%s is required (or set secrets.existingSecret)" $key) (index $values $key) }}
  {{- if and (has $key (list "JWT_SECRET" "API_KEY_PEPPER" "WEBHOOK_SECRET_KEY")) (lt (len $value) 32) }}
  {{- fail (printf "secrets.values.%s must be at least 32 characters" $key) }}
  {{- end }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- range $key := list "MAIL_USERNAME" "MAIL_PASSWORD" "SWIFTDROP_ASSISTANT_APIKEY" "SWIFTDROP_ASSISTANT_OPENROUTER_APIKEY" "SWIFTDROP_ASSISTANT_GROK_APIKEY" }}
  {{- with index $values $key }}
  {{ $key }}: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
