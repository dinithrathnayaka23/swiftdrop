{{- $ctx := dict "root" $ "component" "redis" }}
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "swiftdrop.labels" $ctx | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "swiftdrop.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
# Sign-in sessions, rate-limit counters and cooldowns. Append-only file on a volume, so
# nobody is signed out when the pod restarts.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    {{- include "swiftdrop.labels" $ctx | nindent 4 }}
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "swiftdrop.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "swiftdrop.labels" $ctx | nindent 8 }}
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          command: ["sh", "-c", 'exec redis-server --requirepass "$REDIS_PASSWORD" --appendonly yes']
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "swiftdrop.secretName" . }}
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c", 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    {{- include "swiftdrop.volumeClaim" (dict "root" $ "size" .Values.redis.storage) | nindent 4 }}
