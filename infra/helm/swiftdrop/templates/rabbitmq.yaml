{{- $ctx := dict "root" $ "component" "rabbitmq" }}
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    {{- include "swiftdrop.labels" $ctx | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "swiftdrop.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels:
    {{- include "swiftdrop.labels" $ctx | nindent 4 }}
spec:
  # The pod name (rabbitmq-0) is stable, so the node name rabbit@rabbitmq-0 and its data survive restarts.
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      {{- include "swiftdrop.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "swiftdrop.labels" $ctx | nindent 8 }}
    spec:
      # Service links would inject RABBITMQ_PORT=tcp://..., which RabbitMQ reads as its own setting.
      enableServiceLinks: false
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image }}
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "swiftdrop.secretName" . }}
                  key: RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "swiftdrop.secretName" . }}
                  key: RABBITMQ_PASSWORD
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
          resources:
            {{- toYaml .Values.rabbitmq.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    {{- include "swiftdrop.volumeClaim" (dict "root" $ "size" .Values.rabbitmq.storage) | nindent 4 }}
