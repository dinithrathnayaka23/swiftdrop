# Local kind cluster for SwiftDrop:  kind create cluster --config infra/k8s/kind-config.yaml
# Traefik listens on node ports 30080/30443 (see deploy.sh), mapped to localhost:80 and :443.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: swiftdrop
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        protocol: TCP
