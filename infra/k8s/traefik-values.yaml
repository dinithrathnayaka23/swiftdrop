# Traefik ingress controller (ingress-nginx is retired). Installed by deploy.sh:
#   helm upgrade --install traefik traefik/traefik --version 42.3.0 -n traefik --create-namespace -f infra/k8s/traefik-values.yaml
ingressClass:
  enabled: true
  isDefaultClass: true
providers:
  kubernetesIngress:
    enabled: true
  kubernetesCRD:
    enabled: false
# The live tracking streams (SSE) stay open for minutes; don't cut them at Traefik's 60s default.
additionalArguments:
  - --entryPoints.web.transport.respondingTimeouts.readTimeout=0s
  - --entryPoints.websecure.transport.respondingTimeouts.readTimeout=0s
