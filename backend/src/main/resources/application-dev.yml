# Local development profile (SPRING_PROFILES_ACTIVE=dev).
spring:
  config:
    # Running from an IDE or ./mvnw, read the repo-root .env so you don't have to export variables.
    # Real environment variables still win over values in this file.
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  flyway:
    # Members create migrations in parallel (V3_001, V5_002, ...). Allow a lower version
    # to be applied after a higher one on shared dev databases.
    out-of-order: true

management:
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

swiftdrop:
  security:
    public-api-docs: true
  # AI assistant: values come from the imported .env (or real environment variables). Empty = basic mode.
  assistant:
    provider: ${SWIFTDROP_ASSISTANT_PROVIDER:rules}
    api-key: ${SWIFTDROP_ASSISTANT_API_KEY:}
    model: ${SWIFTDROP_ASSISTANT_MODEL:}
    base-url: ${SWIFTDROP_ASSISTANT_BASE_URL:}
    # Per model call; a model that takes longer hands over to the next one.
    timeout: ${SWIFTDROP_ASSISTANT_TIMEOUT:15s}
    # Tried in this order when the main model fails (e.g. its free quota is used up).
    openrouter:
      api-key: ${SWIFTDROP_ASSISTANT_OPENROUTER_API_KEY:}
      model: ${SWIFTDROP_ASSISTANT_OPENROUTER_MODEL:}
    grok:
      api-key: ${SWIFTDROP_ASSISTANT_GROK_API_KEY:}
      model: ${SWIFTDROP_ASSISTANT_GROK_MODEL:}

logging:
  level:
    com.swiftdrop: DEBUG
