# Base configuration. Every environment-specific value comes from an environment variable;
# there are deliberately no defaults for secrets. See ../.env.example for the full list.
spring:
  application:
    name: swiftdrop

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:swiftdrop}}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only checks it.
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        # Failed messages go to the dead-letter queue instead of being redelivered forever.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

  security:
    oauth2:
      client:
        registration:
          google:
            # Placeholders keep the app bootable until real credentials are provided.
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: openid,profile,email

  mvc:
    log-request-details: false    # request bodies/headers may contain personal data

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    mail:
      enabled: false              # no SMTP server in most environments yet

springdoc:
  api-docs:
    enabled: false                # enabled in the dev profile
  swagger-ui:
    enabled: false

swiftdrop:
  jwt:
    secret: ${JWT_SECRET}
    expiry: ${JWT_EXPIRY:3600}    # seconds
    issuer: swiftdrop
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
  security:
    public-api-docs: false
  mail:
    from: ${MAIL_FROM:no-reply@swiftdrop.local}

logging:
  level:
    root: INFO
    com.swiftdrop: INFO
    # Never log SQL parameter values: they contain personal data.
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: OFF
